name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v0.5.1)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node -e 'const p=require("./package.json"); const t=process.env.RELEASE_TAG.replace(/^v/,""); if (p.version !== t) { console.error(`package.json version ${p.version} does not match tag ${t}`); process.exit(1); }'
      - name: Canonical harness verification
        run: go run ./cmd/harness verify --profile ci
      - name: Publish to npm
        run: |
          npm i -g npm@latest
          npm publish --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; skipping."
          else
            gh release create "$RELEASE_TAG" npm/vendor/* --title "$RELEASE_TAG" --generate-notes
          fi
